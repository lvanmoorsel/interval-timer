<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>Interval Timer</title>
</head>
<body class="home">

<main id="home">
  <h1>Interval Timer</h1>
  <button id="quick" class="big">Snelle tabata (20/10 × 8)</button>

  <h2>Laatste workout</h2>
  <ul id="recent"></ul>

  <h2>Workout plakken</h2>
  <textarea id="paste" rows="5" placeholder="Plak JSON uit ChatGPT, of een volledige link"></textarea>
  <button id="load">Laden</button>
  <p id="err" class="err"></p>
</main>

<main id="run" hidden>
  <header>
    <button id="back" class="icon" aria-label="Stop">✕</button>
    <div id="title"></div>
    <button id="mute" class="icon" aria-label="Geluid">🔊</button>
  </header>

  <section class="center">
    <div id="phase">KLAAR</div>
    <div id="time">00:00</div>
    <div id="exname"></div>
    <div id="exdetail"></div>
    <div id="next"></div>
  </section>

  <section class="dots">
    <div><span>Oefening</span><b id="exdots"></b></div>
    <div><span>Ronde</span><b id="rdots"></b></div>
    <div class="total"><span>Totaal nog</span><b id="total"></b></div>
  </section>

  <footer>
    <button id="prev" class="icon" aria-label="Vorige">⏮</button>
    <button id="toggle" class="play" aria-label="Start/pauze">▶</button>
    <button id="skip" class="icon" aria-label="Volgende">⏭</button>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
