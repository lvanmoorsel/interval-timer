<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>Interval Timer</title>
</head>
<body class="home">

<!-- Home: bibliotheek, favorieten, historie -->
<main id="home">
  <header class="bar">
    <h1>Workouts</h1>
    <button id="new" class="icon" aria-label="New workout" data-icon="plus"></button>
  </header>
  <nav class="session-types" aria-label="Session type"><button data-library-type="interval" aria-pressed="true">Interval / Tabata</button><button data-library-type="gym" aria-pressed="false">Gym / Sets</button></nav>
  <button id="load-gym-example" class="flat" hidden>Load A9 Gym Push example</button>
  <div id="favs-wrap"><h2>Favourites</h2><div id="favs" class="cards"></div></div>
  <h2>All workouts</h2>
  <div id="all" class="cards"></div>
  <h2>History</h2>
  <ul id="history" class="history"></ul>
  <h2>Paste</h2>
  <textarea id="paste" rows="4" placeholder="Paste JSON or a link from ChatGPT"></textarea>
  <button id="load" class="flat">Add</button>
  <p id="err" class="err"></p>
  <button id="check-update" class="flat">Check for updates</button>
  <p id="update-status" role="status">Version 14</p>
</main>

<!-- Editor: zelfde opzet als de Tabata-instellingen -->
<main id="edit" hidden>
  <header class="bar">
    <button id="e-cancel" class="text">Cancel</button>
    <div class="bar-title">Workout</div>
    <button id="e-save" class="text save">Save</button>
  </header>
  <div class="scroll">
    <input id="e-title" class="title-input" placeholder="Name">
    <label class="type-label">Session type<select id="e-type"><option value="interval">Interval / Tabata</option><option value="gym">Gym / Sets</option></select></label>
    <h2>Timing</h2>
    <div id="e-rows" class="rows"></div>
    <h2>Exercises</h2>
    <div id="e-ex" class="ex-list"></div>
    <button id="e-addex" class="flat">+ Exercise</button>
    <section id="e-finisher-wrap" hidden>
      <h2>Finisher circuit</h2>
      <label class="type-label"><input id="e-finisher-enabled" type="checkbox"> Include a timed finisher</label>
      <div id="e-finisher-fields" hidden>
        <div class="gym-fields">
          <label>Rounds<input id="f-rounds" type="number" min="1" max="100"></label>
          <label>Work (s)<input id="f-work" type="number" min="1"></label>
          <label>Rest (s)<input id="f-rest" type="number" min="0"></label>
        </div>
        <div id="f-exercises"></div>
        <button id="f-add" class="flat">+ Finisher exercise</button>
      </div>
    </section>
    <button id="e-del" class="flat danger">Delete workout</button>
  </div>
</main>

<!-- Timer -->
<main id="run" hidden>
  <header class="bar">
    <button id="back" class="icon" aria-label="Stop" data-icon="close"></button>
    <div id="title" class="bar-title"></div>
    <button id="dim" class="icon" aria-label="Dim screen" data-icon="moon"></button>
    <button id="mute" class="icon" aria-label="Sound"></button>
  </header>

  <section class="center">
    <div id="phase">READY</div>
    <div class="clock">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g id="ticks"></g>
        <circle class="track" cx="100" cy="100" r="86"/>
        <circle id="ring" cx="100" cy="100" r="86" transform="rotate(-90 100 100)"/>
      </svg>
      <div id="time">00:00</div>
    </div>
    <div id="exname"></div>
    <div id="exdetail"></div>
    <div id="next"></div>
    <button id="complete-set" hidden>Set completed</button>
  </section>

  <section class="dots">
    <div id="row-cycle"><span>Cycle</span><b id="cydots"></b></div>
    <div id="row-ex"><span>Exercise</span><b id="exdots"></b></div>
    <div><span id="round-label">Round</span><b id="rdots"></b></div>
    <div class="total"><span>Total left</span><b id="total"></b></div>
  </section>

  <footer>
    <button id="prev" class="icon" aria-label="Previous" data-icon="prev"></button>
    <button id="toggle" class="play" aria-label="Start/pause"></button>
    <button id="skip" class="icon" aria-label="Next" data-icon="next"></button>
  </footer>
</main>

<!-- Black screen keeps the app in the foreground. -->
<section id="dim-screen" aria-label="Dimmed timer" hidden>
  <div class="dim-readout">
    <div id="dim-phase">READY</div>
    <div id="dim-time">00:00</div>
    <div id="dim-status"></div>
  </div>
  <button id="undim" aria-label="Restore screen">Restore screen</button>
</section>

<!-- Waarde-kiezer -->
<div id="sheet" hidden>
  <div class="sheet-card">
    <div id="s-label"></div>
    <div id="s-value"></div>
    <div id="s-btns"></div>
    <button id="s-done" class="flat">Done</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
